<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05050f; color: #fff;
    font-family: "Courier New", Courier, monospace; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  #hud { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #hud .label { font-size: 10px; color: #888; letter-spacing: 0.15em; }
  #hud .value { font-size: 20px; color: #00ff88; font-weight: bold; }
  #balance { font-size: 13px; color: #ffd700; }
  canvas { background: #0d0d1a; border: 2px solid #1a1a3e; border-radius: 8px;
    box-shadow: 0 0 24px rgba(0,255,136,0.15); max-width: 100%; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(5,5,15,0.88);
    border-radius: 8px; text-align: center; padding: 20px; }
  #stage { position: relative; }
  h1 { color: #00ff88; font-size: 26px; letter-spacing: 0.15em; margin-bottom: 10px;
    text-shadow: 0 0 18px rgba(0,255,136,0.6); }
  p { font-size: 13px; color: #aaa; line-height: 1.7; margin-bottom: 8px; max-width: 340px; }
  p b { color: #ffd700; }
  button { margin-top: 14px; padding: 14px 34px; font-size: 15px; font-weight: bold;
    letter-spacing: 0.1em; background: #00ff88; color: #000; border: none;
    border-radius: 6px; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: 0.5; cursor: default; }
  #msg { min-height: 20px; font-size: 12px; color: #ff6b6b; margin-top: 10px; }
  #powerups { display: flex; gap: 8px; margin-top: 10px; max-width: 440px; width: 100%; justify-content: center; }
  #powerups button { margin-top: 0; padding: 8px 10px; font-size: 11px; background: #1a1a3e; color: #ffd700; border: 1px solid #ffd700; }
  #powerups button:disabled { opacity: 0.35; }
  #powerups button.active { background: #ffd700; color: #000; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div><div class="label">BEST</div><div class="value" id="best">0</div></div>
    <div><div class="label">LIVES</div><div class="value" id="lives">1</div></div>
    <div><div class="label">COINS</div><div id="balance">...</div></div>
  </div>
  <div id="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h1>NEON SNAKE</h1>
      <p id="introText">Free to play.<br>Score <b>50+</b>, <b>100+</b>, <b>200+</b> to earn <b>extra lives</b>.<br>Power ups below cost <b>1</b> coin each.</p>
      <button id="playBtn">PLAY FREE</button>
      <button id="buyLifeBtn" class="hidden" style="background:#ffd700;">BUY EXTRA LIFE (1 COIN)</button>
      <div id="msg"></div>
    </div>
  </div>
  <div id="powerups">
    <button id="puSlow" title="Slow motion for 10 seconds">SLOW MO<br>1 COIN</button>
    <button id="puLine" title="3 apples lined up ahead">APPLE LINE<br>1 COIN</button>
    <button id="puChill" title="Slow down for the next 3 apples">CHILL OUT<br>1 COIN</button>
  </div>
  <p style="margin-top:10px;font-size:11px;color:#555;">Arrows or WASD to steer. Swipe on touch screens.</p>
</div>
<script>
(function() {
  var SLUG = "snake";
  var params = new URLSearchParams(location.search);
  var playerUserId = params.get("userId") || null;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var balanceEl = document.getElementById("balance");
  var overlay = document.getElementById("overlay");
  var playBtn = document.getElementById("playBtn");
  var buyLifeBtn = document.getElementById("buyLifeBtn");
  var msgEl = document.getElementById("msg");
  var introText = document.getElementById("introText");

  var GRID = 20, CELL = 20;
  var snake, dir, nextDir, food, score, best, alive, loop, speed, lives;
  var livesEl = document.getElementById("lives");
  var puSlowBtn = document.getElementById("puSlow");
  var puLineBtn = document.getElementById("puLine");
  var puChillBtn = document.getElementById("puChill");
  var BASE_SPEED = 140, MIN_SPEED = 70;
  var slowMoUntil = 0, chillApplesLeft = 0;
  var foods = [];
  var lifeMilestones = [50, 100, 200];
  var milestonesHit = {};

  best = parseInt(localStorage.getItem("neonSnakeBest") || "0", 10);
  bestEl.textContent = best;

  function notifyParent(balance) {
    try { window.parent.postMessage({ type: "hgg:coinsUpdated", balance: balance }, "*"); } catch (e) {}
  }

  function api(path, body) {
    return fetch("/api/play/" + SLUG + path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r) { return r.json().then(function(b) { return { ok: r.ok, body: b }; }); });
  }

  function refreshBalance() {
    api("/balance").then(function(res) {
      if (res.ok && typeof res.body.balance === "number") {
        balanceEl.textContent = res.body.balance;
        notifyParent(res.body.balance);
      } else {
        balanceEl.textContent = "sign in";
      }
    }).catch(function() { balanceEl.textContent = "?"; });
  }
  refreshBalance();

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; scoreEl.textContent = "0";
    speed = BASE_SPEED; alive = true;
    lives = 1; livesEl.textContent = "1";
    milestonesHit = {};
    slowMoUntil = 0; chillApplesLeft = 0;
    foods = [];
    placeFood();
  }

  function respawn() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    speed = 140;
    placeFood();
    draw();
  }

  function checkLifeMilestones() {
    for (var i = 0; i < lifeMilestones.length; i++) {
      var m = lifeMilestones[i];
      if (score >= m && !milestonesHit[m]) {
        milestonesHit[m] = true;
        lives += 1; livesEl.textContent = String(lives);
        msgEl.textContent = "Extra life earned at " + m + " points.";
        setTimeout(function(){ msgEl.textContent = ""; }, 2500);
      }
    }
  }

  function freeCell() {
    while (true) {
      var f = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      var clash = snake.some(function(s){ return s.x===f.x && s.y===f.y; }) ||
                  foods.some(function(o){ return o.x===f.x && o.y===f.y; });
      if (!clash) return f;
    }
  }

  function placeFood() {
    food = freeCell();
    foods = [food];
  }

  function placeFoodLine() {
    // 3 apples lined up in front of the snake's head, in travel direction
    foods = [];
    var hx = snake[0].x, hy = snake[0].y;
    for (var i = 1; i <= 3; i++) {
      var fx = hx + dir.x * i * 2, fy = hy + dir.y * i * 2;
      if (fx < 0 || fy < 0 || fx >= GRID || fy >= GRID) break;
      var clash = snake.some(function(s){ return s.x===fx && s.y===fy; });
      if (clash) break;
      foods.push({ x: fx, y: fy });
    }
    if (foods.length === 0) { placeFood(); return; }
    food = foods[0];
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function(s){ return s.x===head.x && s.y===head.y; })) {
      if (lives > 1) {
        lives -= 1; livesEl.textContent = String(lives);
        msgEl.textContent = "Life lost. " + lives + " remaining.";
        setTimeout(function(){ if (alive) msgEl.textContent = ""; }, 2500);
        respawn();
        return;
      }
      return gameOver();
    }
    snake.unshift(head);
    var ateIdx = -1;
    for (var i = 0; i < foods.length; i++) {
      if (head.x === foods[i].x && head.y === foods[i].y) { ateIdx = i; break; }
    }
    if (ateIdx >= 0) {
      foods.splice(ateIdx, 1);
      score += 10; scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best;
        localStorage.setItem("neonSnakeBest", String(best)); }
      // Snake naturally speeds up slightly with every apple, barely noticeable.
      // Chill power-up pauses the speed up for its apple count.
      if (chillApplesLeft > 0) {
        chillApplesLeft -= 1;
      } else if (speed > MIN_SPEED) {
        speed -= 2; restartLoop();
      }
      checkLifeMilestones();
      if (foods.length === 0) placeFood();
      else food = foods[0];
    } else {
      snake.pop();
    }
    draw();
  }

  function effectiveSpeed() {
    if (Date.now() < slowMoUntil) return Math.round(speed * 1.8);
    return speed;
  }
  function restartLoop() { clearInterval(loop); loop = setInterval(tick, effectiveSpeed()); }

  function draw() {
    ctx.fillStyle = "#0d0d1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "#ffd700"; ctx.shadowBlur = 12;
    foods.forEach(function(fd) {
      ctx.fillRect(fd.x*CELL+3, fd.y*CELL+3, CELL-6, CELL-6);
    });
    ctx.shadowBlur = 0;
    snake.forEach(function(s, i) {
      ctx.fillStyle = i === 0 ? "#00ff88" : "rgba(0,255,136," + Math.max(0.25, 0.9 - i*0.05) + ")";
      ctx.shadowColor = "#00ff88"; ctx.shadowBlur = i === 0 ? 14 : 4;
      ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    });
    ctx.shadowBlur = 0;
  }

  function gameOver() {
    alive = false;
    clearInterval(loop);
    introText.innerHTML = "Game over. Score: <b>" + score + "</b><br>Best: <b>" + best + "</b><br>Continue with an extra life for <b>1</b> coin?";
    msgEl.textContent = "";
    overlay.classList.remove("hidden");
    playBtn.textContent = "PLAY AGAIN FREE";
    playBtn.disabled = false;
    buyLifeBtn.classList.remove("hidden");
  }

  buyLifeBtn.addEventListener("click", function() {
    msgEl.textContent = "";
    buyLifeBtn.disabled = true;
    buyLifeBtn.textContent = "BUYING...";
    api("/spend", { amount: 1, reason: "Neon Snake extra life",
      idempotencyKey: "snake-life-" + Date.now() }).then(function(res) {
      buyLifeBtn.disabled = false;
      buyLifeBtn.textContent = "BUY EXTRA LIFE (1 COIN)";
      if (!res.ok) {
        msgEl.textContent = res.body && res.body.error === "Insufficient coins"
          ? "Not enough coins. Grab some in the store for power ups."
          : "Could not buy life: " + ((res.body && res.body.error) || "unknown error");
        return;
      }
      balanceEl.textContent = res.body.balance;
      notifyParent(res.body.balance);
      lives = 1; livesEl.textContent = "1";
      buyLifeBtn.classList.add("hidden");
      overlay.classList.add("hidden");
      alive = true;
      respawn();
      restartLoop();
    }).catch(function() {
      buyLifeBtn.disabled = false;
      buyLifeBtn.textContent = "BUY EXTRA LIFE (1 COIN)";
      msgEl.textContent = "Network error. Try again.";
    });
  });

  playBtn.addEventListener("click", function() {
    msgEl.textContent = "";
    buyLifeBtn.classList.add("hidden");
    overlay.classList.add("hidden");
    reset();
    draw();
    restartLoop();
  });

  function buyPowerUp(kind, btn, applyFn) {
    msgEl.textContent = "";
    btn.disabled = true;
    var label = btn.innerHTML;
    btn.textContent = "...";
    api("/spend", { amount: 1, reason: "Neon Snake power-up " + kind,
      idempotencyKey: "snake-pu-" + kind + "-" + Date.now() }).then(function(res) {
      btn.disabled = false;
      btn.innerHTML = label;
      if (!res.ok) {
        msgEl.textContent = res.body && res.body.error === "Insufficient coins"
          ? "Not enough coins. Grab some in the store for power ups."
          : "Could not buy power-up: " + ((res.body && res.body.error) || "unknown error");
        return;
      }
      balanceEl.textContent = res.body.balance;
      notifyParent(res.body.balance);
      applyFn();
    }).catch(function() {
      btn.disabled = false;
      btn.innerHTML = label;
      msgEl.textContent = "Network error. Try again.";
    });
  }

  puSlowBtn.addEventListener("click", function() {
    if (!alive) { msgEl.textContent = "Start a game first."; return; }
    buyPowerUp("slowmo", puSlowBtn, function() {
      slowMoUntil = Date.now() + 10000;
      puSlowBtn.classList.add("active");
      restartLoop();
      setTimeout(function() {
        puSlowBtn.classList.remove("active");
        if (alive) restartLoop();
      }, 10000);
      msgEl.textContent = "Slow motion for 10 seconds.";
      setTimeout(function(){ if (alive) msgEl.textContent = ""; }, 2500);
    });
  });

  puLineBtn.addEventListener("click", function() {
    if (!alive) { msgEl.textContent = "Start a game first."; return; }
    buyPowerUp("appleline", puLineBtn, function() {
      placeFoodLine();
      draw();
      msgEl.textContent = "3 apples lined up ahead.";
      setTimeout(function(){ if (alive) msgEl.textContent = ""; }, 2500);
    });
  });

  puChillBtn.addEventListener("click", function() {
    if (!alive) { msgEl.textContent = "Start a game first."; return; }
    buyPowerUp("chill", puChillBtn, function() {
      speed = BASE_SPEED;
      chillApplesLeft = 3;
      puChillBtn.classList.add("active");
      restartLoop();
      msgEl.textContent = "Chilled out. No speed up for the next 3 apples.";
      setTimeout(function(){ if (alive) msgEl.textContent = ""; }, 2500);
    });
  });

  // Clear chill highlight once its apples are eaten (checked in tick via chillApplesLeft)
  setInterval(function() {
    if (chillApplesLeft === 0) puChillBtn.classList.remove("active");
  }, 1000);

  document.addEventListener("keydown", function(e) {
    var k = e.key.toLowerCase();
    var d = null;
    if (k === "arrowup" || k === "w") d = {x:0,y:-1};
    else if (k === "arrowdown" || k === "s") d = {x:0,y:1};
    else if (k === "arrowleft" || k === "a") d = {x:-1,y:0};
    else if (k === "arrowright" || k === "d") d = {x:1,y:0};
    if (d) {
      e.preventDefault();
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }
  });

  var tx = 0, ty = 0;
  canvas.addEventListener("touchstart", function(e) {
    var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, {passive:true});
  canvas.addEventListener("touchend", function(e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    var d = null;
    if (Math.abs(dx) > Math.abs(dy)) d = { x: dx > 0 ? 1 : -1, y: 0 };
    else d = { x: 0, y: dy > 0 ? 1 : -1 };
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }, {passive:true});

  draw();
})();
</script>
</body>
</html>
